[package]
name = "scribetex"
version = "0.2.0"
description = "Editor visual de documentos con LaTeX"
license = "MIT"
repository = "https://github.com/Ifcarlitos/ScribeTex"
authors = ["Ifcarlitos"]
edition = "2021"
rust-version = "1.90"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tempfile = "3"
serde = { version = "1", features = ["derive"] }
